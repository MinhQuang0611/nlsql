
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlsql_app
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8388:8388"
    command: ["/app/entrypoint.sh"]
    depends_on:
      - qdrant
      - redis

  wren-ui:
    build:
      context: ./wren-ui
      dockerfile: Dockerfile.dev
    container_name: nlsql_wren_ui
    restart: always
    volumes:
      - ./wren-ui:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3003:3000"
    environment:
      - WREN_ENGINE_URL=http://app:8388
    depends_on:
      - app

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nlsql_qdrant
    ports:
      - "63332:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: nlsql_redis
    ports:
      - "6379:6379"

volumes:
  qdrant_data: