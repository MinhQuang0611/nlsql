<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLSQL Chat - Premium Data Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0f172a;
            --secondary-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --user-msg-bg: #334155;
            --ai-msg-bg: #1e293b;
            --sidebar-width: 300px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Styles */
        aside {
            width: var(--sidebar-width);
            background: var(--secondary-bg);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            height: 100%;
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-color);
        }

        .table-list-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 1rem;
        }

        .sidebar-header {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .search-box {
            background: var(--primary-bg);
            border: 1px solid var(--glass-border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: white;
            width: 100%;
            margin-bottom: 1.5rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .table-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 0.25rem;
            user-select: none;
        }

        .table-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .table-item.selected {
            background: var(--accent-glow);
            border: 1px solid var(--accent-color);
        }

        .table-item input {
            margin-right: 0.75rem;
            accent-color: var(--accent-color);
        }

        .table-item .table-info {
            display: flex;
            flex-direction: column;
        }

        .table-item .table-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .table-item .table-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Chat Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            line-height: 1.6;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg-bg);
            border-bottom-right-radius: 0.25rem;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg-bg);
            border-bottom-left-radius: 0.25rem;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .sql-block {
            background: #000;
            color: #10b981;
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            margin-top: 0.75rem;
            overflow-x: auto;
            border: 1px solid #064e3b;
        }

        .data-table-container {
            margin-top: 1rem;
            overflow-x: auto;
            border-radius: 0.5rem;
            border: 1px solid var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: #0f172a;
        }

        th {
            background: #1e293b;
            text-align: left;
            padding: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--glass-border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Input Area */
        .input-area {
            padding: 1.5rem 2rem;
            background: var(--secondary-bg);
            border-top: 1px solid var(--glass-border);
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            display: flex;
            gap: 1rem;
        }

        #user-input {
            flex: 1;
            background: var(--primary-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            color: white;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        #user-input:focus {
            border-color: var(--accent-color);
        }

        #send-btn {
            background: var(--accent-color);
            color: var(--primary-bg);
            border: none;
            border-radius: 1rem;
            padding: 0 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        #send-btn:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--user-msg-bg);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .execution-info {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            text-align: right;
        }
    </style>
</head>

<body>
    <aside>
        <div class="logo">
            <span>⚡</span> NLSQL AI
        </div>

        <div class="sidebar-header">Search Tables</div>
        <input type="text" class="search-box" id="table-search" placeholder="Type to filter tables...">

        <div class="sidebar-header">Available Tables</div>
        <div class="table-list-container" id="table-list">
            <!-- Tables will be loaded here -->
            <div style="padding: 1rem; color: var(--text-secondary); text-align: center;">Loading tables...</div>
        </div>
    </aside>

    <main>
        <div id="chat-container">
            <div class="message ai">
                Xin chào! Tôi là trợ lý dữ liệu thông minh. Tôi có thể giúp bạn truy vấn dữ liệu từ database bằng ngôn
                ngữ tự nhiên.<br><br>
                Bạn có thể chọn các bảng cụ thể ở thanh bên trái hoặc đặt câu hỏi trực tiếp cho tôi.
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input"
                    placeholder="Nhập câu hỏi của bạn tại đây... (Ví d: Có tổng bao nhiêu sinh viên?)"
                    autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const tableList = document.getElementById('table-list');
        const tableSearch = document.getElementById('table-search');

        let allTables = {};
        let selectedTables = new Set();

        // Fetch tables on load
        async function fetchTables() {
            try {
                const response = await fetch('/api/v1/tables');
                allTables = await response.json();
                renderTableList();
            } catch (error) {
                console.error('Error fetching tables:', error);
                tableList.innerHTML = '<div style="color: #ef4444; padding: 1rem;">Lỗi khi tải danh sách bảng.</div>';
            }
        }

        function renderTableList(filter = '') {
            tableList.innerHTML = '';
            const filtered = Object.keys(allTables).filter(name =>
                name.toLowerCase().includes(filter.toLowerCase()) ||
                allTables[name].toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                tableList.innerHTML = '<div style="color: var(--text-secondary); padding: 1rem; text-align: center;">No tables found.</div>';
                return;
            }

            filtered.forEach(name => {
                const div = document.createElement('div');
                div.className = `table-item ${selectedTables.has(name) ? 'selected' : ''}`;
                div.innerHTML = `
                    <input type="checkbox" ${selectedTables.has(name) ? 'checked' : ''}>
                    <div class="table-info">
                        <span class="table-name">${name}</span>
                        <span class="table-desc">${allTables[name] || 'No description'}</span>
                    </div>
                `;
                div.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const checkbox = div.querySelector('input');
                        checkbox.checked = !checkbox.checked;
                    }
                    if (div.querySelector('input').checked) {
                        selectedTables.add(name);
                        div.classList.add('selected');
                    } else {
                        selectedTables.delete(name);
                        div.classList.remove('selected');
                    }
                };
                tableList.appendChild(div);
            });
        }

        tableSearch.oninput = (e) => renderTableList(e.target.value);

        function appendMessage(role, content, extra = {}) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            let html = `<div>${content}</div>`;

            if (extra.sql) {
                html += `
                    <div style="margin-top: 10px; font-weight: 600; font-size: 0.8rem; color: var(--accent-color)">SQL QUERY:</div>
                    <div class="sql-block">${extra.sql}</div>
                `;
            }

            if (extra.data && extra.data.length > 0) {
                html += '<div class="data-table-container"><table><thead><tr>';
                const cols = Object.keys(extra.data[0]);
                cols.forEach(col => html += `<th>${col}</th>`);
                html += '</tr></thead><tbody>';

                extra.data.slice(0, 10).forEach(row => {
                    html += '<tr>';
                    cols.forEach(col => html += `<td>${row[col]}</td>`);
                    html += '</tr>';
                });

                if (extra.data.length > 10) {
                    html += `<tr><td colspan="${cols.length}" style="text-align: center; color: var(--text-secondary); font-style: italic;">... and ${extra.data.length - 10} more rows</td></tr>`;
                }

                html += '</tbody></table></div>';
            }

            if (extra.execution_time_ms) {
                html += `<div class="execution-info">Execution time: ${extra.execution_time_ms}ms</div>`;
            }

            msgDiv.innerHTML = html;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;

            userInput.value = '';
            appendMessage('user', query);

            sendBtn.disabled = true;
            sendBtn.innerHTML = '<div class="loading"></div>';

            const endpoint = selectedTables.size > 0 ? '/api/v1/chat_with_table' : '/api/v1/chat';
            const body = {
                query: query,
                session_id: "default"
            };
            if (selectedTables.size > 0) {
                body.selected_tables = Array.from(selectedTables);
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();

                if (data.error) {
                    appendMessage('ai', `❌ Lỗi: ${data.error}`);
                } else {
                    appendMessage('ai', data.answer, {
                        sql: data.sql,
                        data: data.data,
                        execution_time_ms: data.execution_time_ms
                    });
                }
            } catch (error) {
                console.error('Chat error:', error);
                appendMessage('ai', '❌ Đã xảy ra lỗi khi kết nối tới máy chủ.');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = 'Send';
            }
        }

        sendBtn.onclick = sendMessage;
        userInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        fetchTables();
    </script>
</body>

</html>
